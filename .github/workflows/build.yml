name: Build KeyboardRounded RootHide

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        uses: theos/theos-action@main

      - name: Build package
        run: |
          make clean package FINALPACKAGE=1

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: KeyboardRounded-deb
          path: packages/*.deb
